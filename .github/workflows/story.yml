name: Daily story
on:
  workflow_run:
    workflows: [Daily ohaasa]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-ohaasa-publishing
  cancel-in-progress: false
jobs:
  story:
    if: vars.AUTO_PUBLISH == 'true' && vars.STORY_PUBLISH == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
      STORY_PUBLISH: ${{ vars.STORY_PUBLISH }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_USERNAME: daily_ohaasa
      IG_LOGIN_MODE: ${{ vars.IG_LOGIN_MODE || 'unified' }}
      IG_API_VERSION: ${{ vars.IG_API_VERSION }}
      STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install story renderer
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y fonts-noto-cjk fonts-liberation2
      - name: Publish story after successful daily posts
        run: python -m ohaasa.story
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-${{ github.run_id }}
          path: build/*/story.jpg
          retention-days: 3
          if-no-files-found: ignore
