name: Check media compatibility
on:
  workflow_dispatch:
    inputs:
      preview_run_id:
        description: 'Successful Daily ohaasa preview run ID'
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: daily-ohaasa-${{ inputs.preview_run_id }}
          run-id: ${{ inputs.preview_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: preview
      - run: python -m pip install requests==2.32.5 'cryptography>=46.0.3,<47'
      - name: Validate unpublished Instagram containers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_LOGIN_MODE: unified
          IG_USERNAME: daily_ohaasa
          PREVIEW_RUN_ID: ${{ inputs.preview_run_id }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from ohaasa.github import GitHub
          from ohaasa.instagram import Instagram
          try:
              api=Instagram(os.environ['IG_ACCESS_TOKEN'])
              api.verify_account()
              root=next(Path('preview').rglob('01.jpg')).parent
              files=[root/f'{i:02}.jpg' for i in range(1,6)]+[root/'reel.mp4']
              github=GitHub()
              github.ensure_public()
              urls=github.release_assets('verification-'+os.environ['PREVIEW_RUN_ID'],files)
              children=[]
              for path in files[:5]:
                  container=api.create(image_url=urls[path.name],is_carousel_item='true')
                  api.wait(container)
                  children.append(container)
              carousel=api.create(media_type='CAROUSEL',children=','.join(children),caption='Compatibility check')
              api.wait(carousel)
              print('All five 3:4 images and carousel accepted by Instagram.')
              reel=api.create(media_type='REELS',video_url=urls['reel.mp4'],caption='Compatibility check',share_to_feed='false')
              api.wait(reel)
              print('10-second silent reel accepted by Instagram. No media_publish call was made.')
          except Exception as exc:
              print(f'ERROR: {type(exc).__name__}: {exc}')
              raise SystemExit(1)
          PY
