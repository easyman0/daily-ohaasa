name: Daily ohaasa

on:
  schedule:
    # UTC -> KST: 22:00 is 07:00 next day. Retry until 09:40 KST.
    - cron: '0,20,40 22,23,0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview creates files only; publish posts today to Instagram'
        type: choice
        options: [preview, publish]
        default: preview
      source:
        description: 'Preview source only; publishing always uses weekday/weekend policy'
        type: choice
        options: [auto, ohaasa, gogo]
        default: auto

permissions:
  contents: write

concurrency:
  group: daily-ohaasa-publishing
  cancel-in-progress: false

jobs:
  daily:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUN_MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode }}
      PREVIEW_SOURCE: ${{ inputs.source || 'auto' }}
      AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      IG_API_VERSION: ${{ vars.IG_API_VERSION }}
      IG_LOGIN_MODE: ${{ vars.IG_LOGIN_MODE || 'unified' }}
      IG_USERNAME: daily_ohaasa
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Skip completed dates
        id: preflight
        run: python preflight.py
      - name: Install rendering dependencies
        if: steps.preflight.outputs.needed == 'true'
        timeout-minutes: 6
        run: |
          python -m pip install -r requirements.txt
          # Avoid the Azure mirror which stalled during the initial preview.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y fonts-noto-cjk fonts-liberation2
      - name: Create and optionally publish
        if: steps.preflight.outputs.needed == 'true'
        shell: bash
        run: |
          if [ "$RUN_MODE" = "publish" ]; then
            python -m ohaasa.main --mode publish
          else
            python -m ohaasa.main --mode preview --source "$PREVIEW_SOURCE"
          fi
      - name: Save review files
        if: always() && steps.preflight.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-ohaasa-${{ github.run_id }}
          path: build/
          retention-days: 3
          if-no-files-found: ignore
